<!doctype html><meta charset="utf-8"><title>Perspective OCR verification</title><button id="test">Run local OCR fixture test</button><pre id="result">Synthetic fixtures only; no Sheet writes.</pre><script type="module">
import {readScreenshots} from '../src/ocr.js?v=3';
document.querySelector('#test').onclick=async()=>{try{const outputs=[];for(const dark of [false,true]){const c=document.createElement('canvas');c.width=800;c.height=1000;const x=c.getContext('2d');x.fillStyle=dark?'#192734':'#ffffff';x.fillRect(0,0,800,1000);x.font='36px Arial';x.fillStyle=dark?'#ffffff':'#000000';['Post analytics','Discovery','Impressions 1,234','Members reached 987','Social engagement','Reactions 24','Comments 3','Reposts 1','Saves 2','Sends 0'].forEach((s,i)=>x.fillText(s,45,65+i*80));const b=await new Promise(r=>c.toBlob(r));const result=await readScreenshots([new File([b],'fixture.png',{type:'image/png'})],s=>document.querySelector('#result').textContent=s,new AbortController().signal);outputs.push({dark,patch:result.patch});}document.querySelector('#result').textContent=JSON.stringify(outputs,null,2);}catch(e){document.querySelector('#result').textContent='FAILED: '+e.message;}};
</script>
